<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE Main plan: 14 Oct to 8 Dec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6fa;--surface:#ffffff;--ink:#17203a;--muted:#5c6684;--line:#dde2ee;
  --phy:#2f6fe4;--phy-bg:#e4edfd;--che:#1f9a62;--che-bg:#e1f4ea;--mat:#c98712;--mat-bg:#fbefd5;--mix:#7a82a0;--mix-bg:#eceef5;
  --accent:#17203a;--done:#1f9a62;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1424;--surface:#181f35;--ink:#e9edf8;--muted:#9aa4c4;--line:#2a3352;
    --phy:#6a9bff;--phy-bg:#1d2b4f;--che:#4cc58a;--che-bg:#153427;--mat:#e8b04a;--mat-bg:#3a2e14;--mix:#8d96b6;--mix-bg:#242c47;
    --accent:#e9edf8;--done:#4cc58a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1424;--surface:#181f35;--ink:#e9edf8;--muted:#9aa4c4;--line:#2a3352;
  --phy:#6a9bff;--phy-bg:#1d2b4f;--che:#4cc58a;--che-bg:#153427;--mat:#e8b04a;--mat-bg:#3a2e14;--mix:#8d96b6;--mix-bg:#242c47;
  --accent:#e9edf8;--done:#4cc58a;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:28px;line-height:1.15}
header p{margin:6px 0 0;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;display:block}
.stat span{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
nav{display:flex;gap:6px;margin:18px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--phy);outline-offset:2px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.day>summary{list-style:none;cursor:pointer;padding:14px 16px;display:block}
.day>summary::-webkit-details-marker{display:none}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dayhead h3{font-size:18px}
.dayhead small{color:var(--muted)}
.today-tag{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;margin-left:8px}
.note{color:var(--muted);font-size:13px;margin-top:2px}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;gap:2px}
.seg i{display:block;height:100%}
.c-Physics{background:var(--phy)}.c-Chemistry{background:var(--che)}.c-Maths{background:var(--mat)}.c-Mixed{background:var(--mix)}
.blocks{padding:4px 16px 14px}
.block{border-top:1px dashed var(--line);padding:10px 0}
.block:first-child{border-top:0}
.bt{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;margin:4px 0;border-left:4px solid var(--mix);background:var(--mix-bg)}
.item.Physics{border-left-color:var(--phy);background:var(--phy-bg)}
.item.Chemistry{border-left-color:var(--che);background:var(--che-bg)}
.item.Maths{border-left-color:var(--mat);background:var(--mat-bg)}
.item input{width:20px;height:20px;margin-top:2px;accent-color:var(--done);flex:none;cursor:pointer}
.item.done .nm{text-decoration:line-through;opacity:.6}
.nm{font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 8px;margin-right:6px;color:var(--ink)}
.mins{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;padding-left:8px}
.week h2{font-size:19px;margin:22px 0 10px}
.weekmeta{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl th{font-weight:600;color:var(--muted);background:var(--bg)}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
select{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.sub{display:flex;align-items:center;gap:8px;margin:20px 0 8px}
.sub i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sub h2{font-size:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hint{color:var(--muted);font-size:13px;margin:8px 0 16px}
.empty{color:var(--muted);padding:24px;text-align:center}
@media (max-width:560px){header h1{font-size:23px}.dayhead h3{font-size:16px}.tbl th,.tbl td{padding:8px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--done);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
.alert.warn{border-left-color:#d69e2e}.alert.bad{border-left-color:#e53e3e}
.abtn{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;margin:4px 6px 4px 0}
.abtn:hover{background:var(--bg)}
.badge{display:none;background:#e53e3e;color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px;font-weight:600}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}
.card2 input[type=time]{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.pbar{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.pbar .arrow{flex:none;width:42px;height:42px;font-size:22px;line-height:1;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.pbar .arrow:disabled{opacity:.35;cursor:default}
.pbar .arrow:hover:not(:disabled){background:var(--bg)}
.plabel{flex:1;text-align:center;min-width:0}
.plabel b{display:block;font-size:16px}
.plabel small{color:var(--muted)}
.pbar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.pbar2 input[type=date]{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.wkstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.dchip{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;font-size:12px;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:6px 4px;cursor:pointer}
.dchip b{font-size:15px;color:var(--ink)}
.dchip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip[aria-current="true"] b{color:var(--bg)}
.dchip i{display:block;width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.dchip i.ok{background:var(--done)}.dchip i.miss{background:#e53e3e}
.dchip.tdy{border-color:var(--ink)}
</style>
</head>

const setSync = (t) => { const el = document.getElementById('sync'); if (el) el.textContent = t; };
const fbKey = k => k.replace(/[.#$\[\]\/]/g, '_');
function pushPatch(kind, key, value){
  cache();
  if (!planRef) return;
  const r = planRef.child(kind + '/' + fbKey(String(key)));
  // false / "Not started" are the defaults, so remove the key instead of storing them
  const isDefault = (kind === 'done' && !value) || (kind === 'chap' && value === 'Not started');
  (isDefault ? r.remove() : r.set(value)).catch(() => setSync("Sync failed, saved on this device only"));
}
function applyRemote(d){
  const remoteDone = d.done || {}, remoteChap = d.chap || {};
  const done = {}, chap = {};
  // state keys are the original keys; remote keys are sanitised, so compare via fbKey
  DATA.days.forEach(day => dayItems(day).forEach(x => { if (remoteDone[fbKey(x.k)]) done[x.k] = true; }));
  DATA.chapters.forEach(c => { if (remoteChap[fbKey(String(c.id))]) chap[c.id] = remoteChap[fbKey(String(c.id))]; });
  state.done = done; state.chap = chap;
  cache(); render(true);
}
(function initSync(){
  if (typeof firebase === 'undefined') { setSync("Can't load Firebase (no internet?). Saved on this device only"); return; }
  const missing = ['apiKey','databaseURL','projectId','appId'].filter(k => !firebaseConfig[k] || /^PASTE/.test(firebaseConfig[k]));
  if (missing.length) { setSync("Not connected: fill in " + missing.join(', ') + " in the config"); return; }
  if (!/^https:\/\/.+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(firebaseConfig.databaseURL)) {
    setSync("databaseURL looks wrong. Copy it exactly from the Realtime Database page"); return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    planRef = db.ref('plan');
    let first = true, connected = false;
    setSync("Connecting...");
    setTimeout(() => { if (!connected) setSync("Can't reach the database. Check databaseURL and that the Realtime Database exists"); }, 8000);
    db.ref('.info/connected').on('value', s => {
      connected = s.val() === true;
      if (connected) setSync("Live: synced"); else if (!first) setSync("Reconnecting...");
    });
    planRef.on('value', snap => {
      const v = snap.val();
      if (v) { applyRemote(v); }
      else if (first) {
        const seed = {done:{}, chap:{}};
        Object.keys(state.done).forEach(k => { if (state.done[k]) seed.done[fbKey(k)] = true; });
        Object.keys(state.chap).forEach(k => { if (state.chap[k] && state.chap[k] !== 'Not started') seed.chap[fbKey(String(k))] = state.chap[k]; });
        if (Object.keys(seed.done).length || Object.keys(seed.chap).length) planRef.set(seed);
        else render(true);
      } else { applyRemote({}); } // everything was cleared on another device
      first = false;
    }, err => setSync("Database refused access: check the Rules tab (" + (err && err.code || 'error') + ")"));
  } catch(e) { setSync("Sync error: " + (e && e.message || e)); }
})();

const localISO = () => { const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); };

function itemKey(day,b,i){ return day.date+"|"+b.n+"|"+i; }
function dayItems(day){ const out=[]; day.blocks.forEach(b=>b.items.forEach((it,i)=>out.push({k:itemKey(day,b,i),it}))); return out; }

function renderStats(){
  let total=0, done=0, mins=0, minsDone=0;
  DATA.days.forEach(d=>dayItems(d).forEach(x=>{ total++; mins+=x.it.mins; if(state.done[x.k]){done++; minsDone+=x.it.mins;} }));
  const ch = DATA.chapters, chDone = ch.filter(c=>["Done","Revised"].includes(state.chap[c.id])).length;
  const ch12 = ch.filter(c=>c.cls===12), ch12d = ch12.filter(c=>["Done","Revised"].includes(state.chap[c.id])).length;
  const ch11 = ch.filter(c=>c.cls===11), ch11d = ch11.filter(c=>["Done","Revised"].includes(state.chap[c.id])).length;
  const pct = total? Math.round(done*100/total):0;
  const card = (big,label,p)=>`<div class="stat"><b>${big}</b><span>${label}</span><div class="bar"><i style="width:${p}%"></i></div></div>`;
  document.getElementById('stats').innerHTML =
    card(pct+"%","of study blocks done ("+hrs(minsDone)+" of "+hrs(mins)+")",pct) +
    card(ch12d+" / "+ch12.length,"pending chapters finished",ch12.length?ch12d*100/ch12.length:0) +
    card(ch11d+" / "+ch11.length,"11th backlog chapters finished",ch11.length?ch11d*100/ch11.length:0);
  renderAlert();
}

function dayCard(day, open){
  const isToday = day.date===localISO();
  const items = dayItems(day);
  const doneN = items.filter(x=>state.done[x.k]).length;
  const seg = items.map(x=>`<i class="c-${esc(x.it.subj)}" style="flex:${x.it.mins}" title="${esc(x.it.label)}, ${x.it.mins} min"></i>`).join('');
  const blocks = day.blocks.map(b=>{
    const its = b.items.map((it,i)=>{
      const k=itemKey(day,b,i), d=!!state.done[k];
      return `<label class="item ${esc(it.subj)} ${d?'done':''}">
        <input type="checkbox" data-k="${esc(k)}" ${d?'checked':''} aria-label="Mark done: ${esc(it.label)}">
        <span><span class="nm">${esc(it.label)}</span><br><span class="chip">${esc(it.tag.replace(' · ',', '))}</span><span class="meta">${esc(it.task)}</span></span>
        <span class="mins">${it.mins} min</span></label>`;
    }).join('');
    return `<div class="block"><div class="bt"><span>Block ${b.n}: ${esc(b.title)}</span><span>${b.mins} min</span></div>${its}</div>`;
  }).join('');
  return `<details class="day" data-date="${day.date}" ${open?'open':''}>
    <summary><div class="dayhead"><h3>${esc(day.dow)}, ${fmtDate(day.date)}${isToday?'<span class="today-tag">Today</span>':''}</h3><small>${hrs(day.total)} · ${doneN}/${items.length} done</small></div>
    ${day.note?`<div class="note">${esc(day.note)}</div>`:''}<div class="seg">${seg}</div></summary>
    <div class="blocks">${blocks}</div></details>`;
}

function viewToday(){
  const t = localISO();
  let day = DATA.days.find(d=>d.date===t);
  let msg = "";
  if(!day){ if(t<DATA.days[0].date){ day=DATA.days[0]; msg="The plan starts on "+fmtDate(day.date)+". Here is day one."; } else { day=DATA.days[DATA.days.length-1]; msg="The plan ended on "+fmtDate(day.date)+". Here is the last day."; } }
  const idx = DATA.days.indexOf(day), nxt = DATA.days[idx+1];
  return (msg?`<p class="hint">${esc(msg)}</p>`:'') + dayCard(day,true) +
    (nxt?`<p class="hint">Next up: ${esc(nxt.dow)}, ${fmtDate(nxt.date)}, ${hrs(nxt.total)}. Open the full schedule to preview it.</p>`:'');
}

function mondayOf(iso){ const d=new Date(iso+"T00:00:00"); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
let planDate = null;
function clampDay(iso){
  const ds = DATA.days.map(d=>d.date);
  if (ds.includes(iso)) return iso;
  return iso < ds[0] ? ds[0] : iso > ds[ds.length-1] ? ds[ds.length-1] : ds.find(x=>x>iso);
}
function dayStatus(d){
  const t = localISO(); let n=0, dn=0;
  d.blocks.forEach(bl=>{ if(isOptional(bl)) return; bl.items.forEach((it,i)=>{ n++; if(state.done[itemKey(d,bl,i)]) dn++; }); });
  if (!n) return '';
  if (dn===n) return 'ok';
  return d.date < t ? 'miss' : '';
}
function stepPlan(n){
  const i = DATA.days.findIndex(d=>d.date===planDate);
  const j = Math.max(0, Math.min(DATA.days.length-1, i+n));
  planDate = DATA.days[j].date; render();
}
function viewPlan(){
  if (!planDate) planDate = clampDay(localISO());
  const t = localISO();
  const idx = DATA.days.findIndex(d=>d.date===planDate);
  const day = DATA.days[idx];
  const mon = mondayOf(day.date);
  const weekDays = DATA.days.filter(d=>mondayOf(d.date)===mon);
  const weeks = [...new Set(DATA.days.map(d=>mondayOf(d.date)))].sort();
  const wkNo = weeks.indexOf(mon)+1;
  const wkMins = weekDays.reduce((a,d)=>a+d.total,0);
  const first = DATA.days[0].date, last = DATA.days[DATA.days.length-1].date;
  const chips = weekDays.map(d=>`<button class="dchip ${d.date===t?'tdy':''}" type="button" data-pd="${d.date}" ${d.date===planDate?'aria-current="true"':''} aria-label="${esc(d.dow)} ${fmtDate(d.date)}"><span>${esc(d.dow)}</span><b>${new Date(d.date+'T00:00:00').getDate()}</b><i class="${dayStatus(d)}"></i></button>`).join('');
  return `<div class="pbar">
      <button class="arrow" type="button" data-pstep="-1" aria-label="Previous day" ${idx===0?'disabled':''}>&#8249;</button>
      <div class="plabel"><b>${esc(day.dow)}, ${fmtDate(day.date)}</b><small>Week ${wkNo} of ${weeks.length} · ${hrs(wkMins)} planned</small></div>
      <button class="arrow" type="button" data-pstep="1" aria-label="Next day" ${idx===DATA.days.length-1?'disabled':''}>&#8250;</button>
    </div>
    <div class="pbar2"><button class="abtn" type="button" data-ptoday="1">Today</button>
      <label class="meta">Jump to <input type="date" id="pDate" value="${planDate}" min="${first}" max="${last}"></label></div>
    <div class="wkstrip" aria-label="Days in this week">${chips}</div>` + dayCard(day, true);
}
document.getElementById('view').addEventListener('click', e=>{
  const st = e.target.closest('[data-pstep]'); if (st) { stepPlan(+st.dataset.pstep); return; }
  const pd = e.target.closest('[data-pd]'); if (pd) { planDate = pd.dataset.pd; render(); return; }
  if (e.target.closest('[data-ptoday]')) { planDate = clampDay(localISO()); render(); }
});
document.getElementById('view').addEventListener('change', e=>{
  if (e.target.id==='pDate' && e.target.value) { planDate = clampDay(e.target.value); render(); }
});
document.addEventListener('keydown', e=>{
  if (tab!=='plan' || (e.key!=='ArrowLeft' && e.key!=='ArrowRight')) return;
  const a = document.activeElement;
  if (a && (a.tagName==='SELECT' || a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.type!=='checkbox'))) return;
  stepPlan(e.key==='ArrowRight' ? 1 : -1);
});

function viewChapters(){
  const subjects=["Physics","Chemistry","Maths"];
  const stat=["Not started","In progress","Done","Revised"];
  return `<p class="hint">Mark a chapter Done when you have finished theory, practice and PYQs. Planned dates come from the schedule.</p>` +
  subjects.map(s=>{
    const rows=DATA.chapters.filter(c=>c.subj===s).sort((a,b)=>(a.finish||'9').localeCompare(b.finish||'9')||a.id-b.id).map(c=>{
      const v=state.chap[c.id]||"Not started";
      return `<tr><td>${esc(c.name)}</td><td>${c.cls===12?'12th pending':'11th backlog'}</td><td>${c.hrs} h</td><td>${fmtDate(c.start)} to ${fmtDate(c.finish)}</td><td><select data-c="${c.id}" aria-label="Status of ${esc(c.name)}">${stat.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></td></tr>`;
    }).join('');
    return `<div class="sub"><i class="c-${s}"></i><h2>${s}</h2></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Chapter</th><th>Type</th><th>Time</th><th>Planned</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
}

/* ================= Behind tab, alerts ================= */
const BASE_TITLE = document.title;
const isOptional = b => /\[optional\]/.test(b.title);
function behindData(){
  const t = localISO(); let tot=0, cnt=0, opt=0; const days=[], bySubj={};
  DATA.days.forEach(d=>{
    if (d.date >= t) return;
    const missed=[]; let optM=0;
    d.blocks.forEach(b=>{ const o=isOptional(b); b.items.forEach((it,i)=>{ const k=itemKey(d,b,i);
      if (state.done[k]) return;
      if (o) { optM+=it.mins; return; }
      missed.push({k,it,b}); }); });
    opt += optM;
    if (missed.length) {
      const mm = missed.reduce((a,x)=>a+x.it.mins,0);
      days.push({d,missed,mm}); tot+=mm; cnt+=missed.length;
      missed.forEach(x=>{ bySubj[x.it.subj]=(bySubj[x.it.subj]||0)+x.it.mins; });
    }
  });
  let todayLeft=0, todayN=0;
  const td = DATA.days.find(d=>d.date===t);
  if (td) td.blocks.forEach(b=>{ if(isOptional(b)) return; b.items.forEach((it,i)=>{ if(!state.done[itemKey(td,b,i)]){ todayLeft+=it.mins; todayN++; } }); });
  let slack=0, remaining=0;
  DATA.days.forEach(d=>{ if (d.date>=t) { if (d.total>0) remaining++; d.blocks.forEach(b=>b.items.forEach(it=>{ if (it.label.startsWith('Full-syllabus revision')) slack+=it.mins; })); } });
  return {t,tot,cnt,opt,days,bySubj,todayLeft,todayN,slack,remaining};
}
function worstSubject(bd){ return Object.entries(bd.bySubj).sort((a,b)=>b[1]-a[1])[0]; }
function renderAlert(){
  const el = document.getElementById('alertbar'); if (!el) return;
  const bd = behindData(); let cls='ok', txt='';
  if (!bd.cnt) txt = 'Nothing missed before today. Keep going.';
  else {
    cls = (bd.tot>=240 || (bd.slack && bd.tot>bd.slack)) ? 'bad' : (bd.tot>=60 ? 'warn' : 'ok');
    const w = worstSubject(bd);
    txt = 'You are '+hrs(bd.tot)+' behind: '+bd.cnt+' block'+(bd.cnt>1?'s':'')+' missed over '+bd.days.length+' day'+(bd.days.length>1?'s':'')+'. Biggest gap: '+w[0]+' ('+hrs(w[1])+').';
    if (!bd.slack && bd.tot>=60) txt += ' There is no buffer left at the end of the plan, so every missed hour moves the end date. Ask Claude to reflow the schedule.';
    if (bd.slack && bd.tot>bd.slack) txt += ' That is more than the '+hrs(bd.slack)+' buffer at the end of the plan, so the end date is at risk. Ask Claude to reflow the schedule.';
  }
  el.innerHTML = '<div class="alert '+cls+'"><span>'+esc(txt)+'</span>'+(bd.cnt && tab!=='behind' ? '<button class="abtn" type="button" data-gotab="behind">See what I missed</button>' : '')+'</div>';
  const bdg = document.getElementById('behindBadge');
  if (bdg) { bdg.textContent = bd.tot ? hrs(bd.tot) : ''; bdg.style.display = bd.tot ? 'inline-block' : 'none'; }
  document.title = (bd.tot>=30 ? '('+hrs(bd.tot)+' behind) ' : '') + BASE_TITLE;
}

/* pop-up reminders (per device, only while the page is open in a tab) */
const AKEY = 'jee-alert-v1';
let A = {on:false, time:'21:00', last:''};
try { Object.assign(A, JSON.parse(localStorage.getItem(AKEY)||'{}')); } catch(e) {}
const saveA = () => { try { localStorage.setItem(AKEY, JSON.stringify(A)); } catch(e) {} };
const notifOK = () => ('Notification' in window);
function alertMsg(bd){
  const bits=[];
  if (bd.todayN) bits.push('Today: '+bd.todayN+' block'+(bd.todayN>1?'s':'')+' left ('+hrs(bd.todayLeft)+')');
  if (bd.tot) bits.push('Behind by '+hrs(bd.tot)+' from earlier days');
  return bits.join('. ');
}
function checkAlert(force){
  if (!A.on || !notifOK() || Notification.permission!=='granted') return;
  const n=new Date(), p=x=>String(x).padStart(2,'0'), hm=p(n.getHours())+':'+p(n.getMinutes()), t=localISO();
  if (!force && (A.last===t || hm < A.time)) return;
  const msg = alertMsg(behindData());
  if (msg) { try { new Notification('JEE plan', {body:msg}); } catch(e) {} }
  A.last=t; saveA();
}
setInterval(checkAlert, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkAlert(); });
setTimeout(checkAlert, 1500);

function itemHtml(k, it){
  return `<label class="item ${esc(it.subj)}">
    <input type="checkbox" data-k="${esc(k)}" aria-label="Mark done: ${esc(it.label)}">
    <span><span class="nm">${esc(it.label)}</span><br><span class="chip">${esc(it.tag.replace(' · ',', '))}</span><span class="meta">${esc(it.task)}</span></span>
    <span class="mins">${it.mins} min</span></label>`;
}
function alertCard(){
  let status;
  if (!notifOK()) status = 'This browser cannot show pop-up alerts. The red banner and the tab title still show when you open the page.';
  else if (Notification.permission==='denied') status = 'Pop-ups are blocked for this site. Allow notifications in the browser settings to use them.';
  else status = A.on ? 'On. A reminder pops up once a day after the time below, if you have something left or are behind.' : 'Off.';
  return `<div class="card2"><b>Alerts on this device</b>
    <p class="meta">${esc(status)} Pop-ups only appear while this page is open in a browser tab (a background tab is fine), not when it is closed.</p>
    <label class="meta">Daily reminder after <input type="time" id="aTime" value="${esc(A.time)}"></label><br>
    <button class="abtn" type="button" id="aToggle">${A.on?'Turn off pop-up alerts':'Turn on pop-up alerts'}</button>
    <button class="abtn" type="button" id="aTest">Send a test</button></div>`;
}
function viewBehind(){
  const bd = behindData();
  const card=(big,label,p)=>`<div class="stat"><b>${big}</b><span>${label}</span><div class="bar"><i style="width:${p}%"></i></div></div>`;
  let h = '<p class="hint">Counts every block from days before today that is not ticked. Today only counts once it is over. Blocks marked [optional] are never counted. Tick a block here when you catch up and it drops off the list.</p>';
  const used = bd.slack ? Math.min(100, Math.round(bd.tot*100/bd.slack)) : (bd.tot?100:0);
  h += '<div class="stats">' +
    card(hrs(bd.tot), 'behind ('+bd.cnt+' blocks, '+bd.days.length+' days)', used) +
    card(bd.todayN+' blocks', 'left today ('+hrs(bd.todayLeft)+')', 0) +
    card(hrs(Math.max(0,bd.slack-bd.tot)), bd.slack ? 'of the '+hrs(bd.slack)+' end-of-plan buffer left' : 'end-of-plan buffer left (none: every missed hour moves the end date)', bd.slack?Math.max(0,100-used):0) + '</div>';
  const chips = Object.entries(bd.bySubj).sort((a,b)=>b[1]-a[1]).map(([s,m])=>`<span class="chip">${esc(s==='Mixed'?'Revision and tests':s)}: ${hrs(m)}</span>`).join('');
  if (chips) h += '<p class="meta" style="margin:12px 0 4px">Where the gap is</p><div>'+chips+'</div>';
  if (bd.tot && bd.remaining) h += '<p class="hint">Catching up over the next 7 days would mean about '+Math.ceil(bd.tot/7)+' extra minutes a day on top of the plan. If that is too much, tell Claude and it will move the end date instead of adding hours.</p>';
  if (bd.opt) h += '<p class="hint">Optional blocks skipped: '+hrs(bd.opt)+' (not counted above).</p>';
  h += alertCard();
  if (!bd.days.length) return h + '<div class="empty">Nothing missed. You are caught up.</div>';
  h += '<div class="sub"><h2>What you missed, day by day</h2></div>';
  h += bd.days.map(x=>{
    const seg = x.missed.map(m=>`<i class="c-${esc(m.it.subj)}" style="flex:${m.it.mins}" title="${esc(m.it.label)}, ${m.it.mins} min"></i>`).join('');
    return `<details class="day" data-date="${x.d.date}">
      <summary><div class="dayhead"><h3>${esc(x.d.dow)}, ${fmtDate(x.d.date)}</h3><small>${hrs(x.mm)} missed · ${x.missed.length} block${x.missed.length>1?'s':''}</small></div><div class="seg">${seg}</div></summary>
      <div class="blocks"><div class="block"><button class="abtn" type="button" data-markday="${x.d.date}">Mark the whole day done</button>${x.missed.map(m=>itemHtml(m.k,m.it)).join('')}</div></div></details>`;
  }).join('');
  return h;
}
function setTab(name){
  tab = name;
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab===name));
  render();
}
document.getElementById('alertbar').addEventListener('click', e=>{ const b=e.target.closest('[data-gotab]'); if(b) setTab(b.dataset.gotab); });
document.getElementById('view').addEventListener('click', e=>{
  const m = e.target.closest('[data-markday]');
  if (m) {
    const day = DATA.days.find(d=>d.date===m.dataset.markday); if (!day) return;
    day.blocks.forEach(b=>{ if(isOptional(b)) return; b.items.forEach((it,i)=>{ const k=itemKey(day,b,i); if(!state.done[k]){ state.done[k]=true; pushPatch('done',k,true); } }); });
    render(true); return;
  }
  if (e.target.id==='aToggle') {
    if (A.on) { A.on=false; saveA(); render(true); return; }
    if (!notifOK()) { render(true); return; }
    Notification.requestPermission().then(p=>{ A.on = (p==='granted'); saveA(); render(true); }).catch(()=>render(true));
    return;
  }
  if (e.target.id==='aTest') {
    const msg = alertMsg(behindData()) || 'You are all caught up.';
    if (notifOK() && Notification.permission==='granted') { try { new Notification('JEE plan (test)', {body:msg}); } catch(err) {} }
    else if (notifOK()) { Notification.requestPermission().then(p=>{ if(p==='granted'){ A.on=true; saveA(); try{ new Notification('JEE plan (test)', {body:msg}); }catch(err){} } render(true); }); }
  }
});
document.getElementById('view').addEventListener('change', e=>{
  if (e.target.id==='aTime') { A.time = e.target.value || '21:00'; A.last=''; saveA(); }
});

let tab="today";
function render(keep){
  const v=document.getElementById('view');
  const open = keep ? new Set([...document.querySelectorAll('details.day[open]')].map(d=>d.dataset.date)) : null;
  const closed = keep ? new Set([...document.querySelectorAll('details.day:not([open])')].map(d=>d.dataset.date)) : null;
  const y = window.scrollY;
  v.innerHTML = tab==="today"?viewToday():tab==="plan"?viewPlan():tab==="behind"?viewBehind():viewChapters();
  if (keep) {
    document.querySelectorAll('details.day').forEach(d=>{ if(open.has(d.dataset.date)) d.open=true; else if(closed.has(d.dataset.date)) d.open=false; });
    window.scrollTo(0,y);
  }
  if (!canWrite) v.querySelectorAll('input[data-k],select[data-c]').forEach(x=>x.disabled=true);
  renderStats();
}
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  setTab(b.dataset.tab);
});
document.getElementById('view').addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[data-k]')){
    state.done[t.dataset.k]=t.checked; pushPatch('done', t.dataset.k, t.checked);
    t.closest('.item').classList.toggle('done',t.checked); renderStats(); if(tab==='behind') setTimeout(()=>render(true),250);
    const det=t.closest('details'); if(det){ const items=det.querySelectorAll('input[data-k]'); const n=[...items].filter(i=>i.checked).length; const sm=det.querySelector('summary small'); if(sm){ sm.textContent=sm.textContent.replace(/\d+\/\d+ done/, n+"/"+items.length+" done"); } }
  } else if(t.matches('select[data-c]')){
    state.chap[t.dataset.c]=t.value; pushPatch('chap', t.dataset.c, t.value); renderStats();
  }
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  const r=document.documentElement; const cur=r.getAttribute('data-theme');
  const sysDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next=(cur?cur==='dark':sysDark)?'light':'dark'; r.setAttribute('data-theme',next);
});
render();
</script>
